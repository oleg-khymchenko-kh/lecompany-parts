# parts.lecompany.co.uk
#
# Unlike app.lecompany.co.uk, which serves a static Angular bundle straight off
# disk, this site is server-rendered: the catalogue has to be crawlable, so
# nginx proxies to the Next.js server instead of using try_files.
#
# Certbot appends the 443 block and the port-80 redirect to this file.

upstream parts_web {
    server 127.0.0.1:3030;
    keepalive 32;
}

upstream parts_api {
    server 127.0.0.1:3031;
    keepalive 32;
}

server {
    listen 80;
    server_name parts.lecompany.co.uk;

    root /home/parts.lecompany.co.uk/public_html;
    client_max_body_size 50M;

    access_log /home/parts.lecompany.co.uk/logs/nginx-access.log;
    error_log  /home/parts.lecompany.co.uk/logs/nginx-error.log;

    # Immutable, content-hashed build assets.
    location /_next/static/ {
        alias /home/parts.lecompany.co.uk/public_html/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The trailing slash strips the /api/ prefix: /api/auth/login reaches
    # Fastify as /auth/login.
    location /api/ {
        proxy_pass http://parts_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stripe webhook signatures are computed over the exact bytes sent.
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://parts_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
